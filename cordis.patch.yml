# Session-isolated personalization memory for a DeepSeek Harness Web profile.
# This out-of-tree bundle owns its service, Remote contract, and settings entry.
# Current DSH base/web bundles also ship an experimental in-tree memory service
# under the same Remote namespace. Disable those rows here so a clean profile
# never mounts two `sessionMemory` providers.
- id: session-memory-governance
  disabled: true

- id: ui-session-memory
  disabled: true

# Web's stock overlay disables the engine and its /compact command. The
# Mindspace policy card is a real per-session control, so restore both after
# that overlay has composed; the engine remains the sole surface rewriter.
- id: compaction-basic
  disabled: false

- id: command-compact
  disabled: false

- insert:
    - id: mindspace-session-memory
      name: mindspace-dsh-session-memory
      config:
        maxTextBytes: 4096
        maxItemsPerSection: 3
        maxProfileCharacters: 300
        autoExtract: true
        autoExtractBelowUtilization: 0.2
        extractionMaxTokens: 6000
