# Session-isolated personalization memory for a DeepSeek Harness Web profile.
# One package-root row is both the Host service and the dsh.client contributor.
- insert:
    - id: mindspace-session-memory
      name: mindspace-dsh-session-memory
      config:
        maxTextBytes: 4096
        maxItemsPerSection: 64
        autoExtract: true
        extractionMaxTokens: 1024
