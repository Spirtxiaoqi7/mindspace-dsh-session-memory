# Session-isolated personalization memory for a DeepSeek Harness Web profile.
# This out-of-tree bundle owns its service, Remote contract, and settings entry.
# It does not target or disable entries from another checkout, so the patch is
# portable across clean official profiles.
- insert:
    - id: mindspace-session-memory
      name: mindspace-dsh-session-memory
      config:
        maxTextBytes: 4096
        autoExtract: true
        extractionMaxTokens: 3072
