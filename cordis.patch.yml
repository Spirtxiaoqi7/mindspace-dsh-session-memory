# Session-isolated personalization memory for a DeepSeek Harness Web profile.
# Disable the experimental in-tree V1 pair when present so this bundle remains
# the only owner of the service, Remote contract, and settings entry.
- id: session-memory-governance
  disabled: true
- id: ui-session-memory
  disabled: true
- insert:
    - id: mindspace-session-memory
      name: mindspace-dsh-session-memory
      config:
        maxTextBytes: 4096
        autoExtract: true
        extractionMaxTokens: 3072
